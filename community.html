<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Freedom Community</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family:
                Arial,
                sans-serif;

            background: #FBF8F3;

            color: #2D2D2D;

        }


        /* =========================
           HEADER
        ========================= */

        .topbar {

            background: #6E4A7E;

            color: white;

            padding: 18px 25px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            position: sticky;

            top: 0;

            z-index: 100;

        }


        .brand {

            font-size: 20px;

            font-weight: 700;

        }


        .back-btn {

            border: none;

            background:
                rgba(255,255,255,0.15);

            color: white;

            padding:
                10px 16px;

            border-radius: 10px;

            cursor: pointer;

        }


        /* =========================
           PAGE
        ========================= */

        .page {

            max-width: 1050px;

            margin: auto;

            padding:
                35px 20px 60px;

        }


        .hero {

            text-align: center;

            margin-bottom: 30px;

        }


        .hero h1 {

            color: #6E4A7E;

            font-size: 32px;

            margin-bottom: 10px;

        }


        .hero p {

            color: #666;

            line-height: 1.7;

            max-width: 650px;

            margin: auto;

        }


        /* =========================
           CATEGORY BUTTONS
        ========================= */

        .categories {

            display: flex;

            flex-wrap: wrap;

            justify-content: center;

            gap: 10px;

            margin-bottom: 25px;

        }


        .category-btn {

            background: white;

            color: #6E4A7E;

            border:
                1px solid #DCCBB3;

            padding:
                10px 16px;

            border-radius: 25px;

            cursor: pointer;

            font-size: 13px;

        }


        .category-btn.active {

            background: #6E4A7E;

            color: white;

            border-color: #6E4A7E;

        }


        /* =========================
           CREATE POST
        ========================= */

        .create-box {

            background: white;

            border:
                1px solid #E7DDD2;

            border-radius: 18px;

            padding: 22px;

            margin-bottom: 25px;

            box-shadow:
                0 5px 18px
                rgba(0,0,0,0.04);

        }


        .create-box h2 {

            color: #6E4A7E;

            font-size: 19px;

            margin-bottom: 15px;

        }


        textarea {

            width: 100%;

            min-height: 110px;

            resize: vertical;

            border:
                1px solid #DCCBB3;

            border-radius: 12px;

            padding: 14px;

            font-family: inherit;

            font-size: 14px;

            outline: none;

        }


        textarea:focus {

            border-color: #6E4A7E;

        }


        .create-footer {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-top: 12px;

            gap: 10px;

        }


        .current-category {

            font-size: 13px;

            color: #777;

        }


        .post-btn {

            background: #6E4A7E;

            color: white;

            border: none;

            padding:
                11px 22px;

            border-radius: 10px;

            cursor: pointer;

            font-weight: 600;

        }


        .post-btn:disabled {

            opacity: 0.5;

            cursor: not-allowed;

        }


        /* =========================
           POSTS
        ========================= */

        #communityContainer {

            display: flex;

            flex-direction: column;

            gap: 18px;

        }


        .post-card {

            background: white;

            border:
                1px solid #E7DDD2;

            border-radius: 18px;

            padding: 20px;

            box-shadow:
                0 4px 15px
                rgba(0,0,0,0.035);

        }


        .post-header {

            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            gap: 15px;

            margin-bottom: 15px;

        }


        .member {

            display: flex;

            align-items: center;

            gap: 11px;

        }


        .avatar {

            width: 42px;

            height: 42px;

            border-radius: 50%;

            background: #DCCBB3;

            color: #6E4A7E;

            display: flex;

            align-items: center;

            justify-content: center;

            font-weight: 700;

        }


        .member-name {

            font-weight: 700;

            font-size: 14px;

        }


        .post-date {

            font-size: 11px;

            color: #999;

            margin-top: 3px;

        }


        .badge {

            background: #F1EAF3;

            color: #6E4A7E;

            padding:
                6px 10px;

            border-radius: 20px;

            font-size: 11px;

            font-weight: 700;

        }


        .post-message {

            font-size: 14px;

            line-height: 1.7;

            white-space: pre-wrap;

        }


        .post-actions {

            border-top:
                1px solid #F0EAE3;

            margin-top: 15px;

            padding-top: 12px;

            display: flex;

            gap: 10px;

        }


        .action-btn {

            background: none;

            border: none;

            color: #6E4A7E;

            cursor: pointer;

            font-size: 13px;

        }


        .delete-btn {

            color: #A33A3A;

        }


        /* =========================
           EMPTY / LOADING
        ========================= */

        .empty {

            background: white;

            border:
                1px solid #E7DDD2;

            border-radius: 18px;

            padding: 45px 20px;

            text-align: center;

            color: #777;

        }


        .empty h3 {

            color: #6E4A7E;

            margin-bottom: 8px;

        }


        .loading {

            text-align: center;

            padding: 35px;

            color: #777;

        }


        /* =========================
           REPLIES
        ========================= */

        .replies {

            margin-top: 15px;

            padding-left: 15px;

            border-left:
                2px solid #DCCBB3;

        }


        .reply {

            background: #FBF8F3;

            border-radius: 10px;

            padding: 10px 12px;

            margin-bottom: 8px;

        }


        .reply-name {

            font-weight: 700;

            color: #6E4A7E;

            font-size: 12px;

            margin-bottom: 4px;

        }


        .reply-message {

            font-size: 13px;

            line-height: 1.5;

        }


        .reply-form {

            display: none;

            gap: 8px;

            margin-top: 12px;

        }


        .reply-form.show {

            display: flex;

        }


        .reply-input {

            flex: 1;

            border:
                1px solid #DCCBB3;

            border-radius: 9px;

            padding: 9px;

            outline: none;

            font-family: inherit;

        }


        .reply-submit {

            border: none;

            background: #6E4A7E;

            color: white;

            border-radius: 9px;

            padding:
                8px 13px;

            cursor: pointer;

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .page {

                padding:
                    25px 14px 50px;

            }


            .hero h1 {

                font-size: 27px;

            }


            .post-header {

                flex-direction: column;

            }


            .create-footer {

                flex-direction: column;

                align-items: stretch;

            }


            .post-btn {

                width: 100%;

            }


            .reply-form.show {

                flex-direction: column;

            }


            .reply-submit {

                width: 100%;

            }

        }

    </style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="topbar">

    <div class="brand">
        Freedom Community
    </div>


    <button
        class="back-btn"
        id="backBtn"
    >
        ← Back to Dashboard
    </button>

</header>



<!-- =========================
     MAIN
========================= -->

<main class="page">


    <section class="hero">

        <h1>
            Freedom Community
        </h1>

        <p>
            Share your journey, ask questions,
            celebrate your wins and support other
            Freedom members.
        </p>

    </section>



    <!-- =========================
         CATEGORIES
    ========================= -->

    <div class="categories">

        <button
            class="category-btn active"
            data-category="all"
        >
            All
        </button>


        <button
            class="category-btn"
            data-category="checkin"
        >
            Daily Check-ins
        </button>


        <button
            class="category-btn"
            data-category="workout"
        >
            Workout & Exercise
        </button>


        <button
            class="category-btn"
            data-category="wins"
        >
            Wins
        </button>


        <button
            class="category-btn"
            data-category="question"
        >
            Questions
        </button>


        <button
            class="category-btn"
            data-category="discussion"
        >
            Discussions
        </button>

    </div>



    <!-- =========================
         CREATE POST
    ========================= -->

    <section class="create-box">

        <h2>
            Share with the community
        </h2>


        <textarea
            id="messageInput"
            placeholder="Share your progress, ask a question, celebrate a win or start a discussion..."
        ></textarea>


        <div class="create-footer">

            <span
                class="current-category"
                id="currentCategory"
            >
                Category: Community
            </span>


            <button
                class="post-btn"
                id="postButton"
            >
                Post
            </button>

        </div>

    </section>



    <!-- =========================
         COMMUNITY POSTS
    ========================= -->

    <section id="communityContainer">

        <div class="loading">
            Loading community...
        </div>

    </section>


</main>



<!-- =========================
     FIREBASE
========================= -->

<script type="module">


    /* =====================================================
       FIREBASE IMPORTS
    ===================================================== */

    import {
        initializeApp
    }
    from
        "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


    import {
        getAuth,
        onAuthStateChanged
    }
    from
        "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


    import {
        getFirestore,
        collection,
        addDoc,
        getDocs,
        deleteDoc,
        updateDoc,
        doc,
        query,
        orderBy,
        serverTimestamp
    }
    from
        "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



    /* =====================================================
       FIREBASE CONFIG
    =====================================================

       IMPORTANT:

       Paste the EXACT SAME firebaseConfig
       from your existing dashboard here.

    ===================================================== */

    const firebaseConfig = {

        apiKey:
            "PASTE_YOUR_API_KEY",

        authDomain:
            "PASTE_YOUR_AUTH_DOMAIN",

        projectId:
            "PASTE_YOUR_PROJECT_ID",

        storageBucket:
            "PASTE_YOUR_STORAGE_BUCKET",

        messagingSenderId:
            "PASTE_YOUR_MESSAGING_SENDER_ID",

        appId:
            "PASTE_YOUR_APP_ID"

    };



    /* =====================================================
       INITIALIZE FIREBASE
    ===================================================== */

    const app =
        initializeApp(
            firebaseConfig
        );


    const auth =
        getAuth(app);


    const db =
        getFirestore(app);



    /* =====================================================
       VARIABLES
    ===================================================== */

    let currentUser = null;

    let currentCategory = "all";

    let allPosts = [];



    /* =====================================================
       CATEGORY NAMES
    ===================================================== */

    const categoryNames = {

        checkin:
            "Daily Check-in",

        workout:
            "Workout & Exercise",

        wins:
            "Win",

        question:
            "Question",

        discussion:
            "Discussion"

    };



    /* =====================================================
       ADMIN EMAIL
    =====================================================

       This matches your Firestore rules.

    ===================================================== */

    const ADMIN_EMAIL =
        "mahnoordietitian3@gmail.com";



    /* =====================================================
       ESCAPE HTML
    ===================================================== */

    function escapeHTML(value) {

        return String(
            value || ""
        )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

    }



    /* =====================================================
       GET MEMBER NAME
    ===================================================== */

    function getMemberName() {

        if (
            currentUser &&
            currentUser.displayName
        ) {

            return currentUser.displayName;

        }


        if (
            currentUser &&
            currentUser.email
        ) {

            return currentUser.email
                .split("@")[0];

        }


        return "Freedom Member";

    }



    /* =====================================================
       GET INITIAL
    ===================================================== */

    function getInitial(name) {

        return String(
            name || "F"
        )
        .trim()
        .charAt(0)
        .toUpperCase();

    }



    /* =====================================================
       FORMAT DATE
    ===================================================== */

    function formatDate(timestamp) {

        if (!timestamp) {

            return "Just now";

        }


        try {

            const date =
                timestamp.toDate
                    ? timestamp.toDate()
                    : new Date(timestamp);


            return date.toLocaleString(
                "en-PK",
                {
                    dateStyle:
                        "medium",
                    timeStyle:
                        "short"
                }
            );

        }

        catch {

            return "Recently";

        }

    }



    /* =====================================================
       LOAD COMMUNITY
    ===================================================== */

    async function loadCommunity() {

        const container =
            document.getElementById(
                "communityContainer"
            );


        container.innerHTML = `

            <div class="loading">
                Loading community...
            </div>

        `;


        try {

            const communityQuery =
                query(
                    collection(
                        db,
                        "community"
                    ),

                    orderBy(
                        "createdAt",
                        "desc"
                    )
                );


            const snapshot =
                await getDocs(
                    communityQuery
                );


            allPosts = [];


            snapshot.forEach(
                postDoc => {

                    allPosts.push({

                        id:
                            postDoc.id,

                        ...postDoc.data()

                    });

                }
            );


            renderCommunity();

        }

        catch(error) {

            console.error(
                "COMMUNITY LOAD ERROR:",
                error
            );


            container.innerHTML = `

                <div class="empty">

                    <h3>
                        Community could not load
                    </h3>

                    <p>
                        Please check your Firebase
                        configuration and Firestore
                        rules.
                    </p>

                </div>

            `;

        }

    }



    /* =====================================================
       RENDER COMMUNITY
    ===================================================== */

    function renderCommunity() {

        const container =
            document.getElementById(
                "communityContainer"
            );


        let posts =
            allPosts;


        if (
            currentCategory !==
            "all"
        ) {

            posts =
                allPosts.filter(
                    post =>
                        post.category ===
                        currentCategory
                );

        }


        if (!posts.length) {

            container.innerHTML = `

                <div class="empty">

                    <h3>
                        No posts yet
                    </h3>

                    <p>
                        Be the first member to
                        share something here.
                    </p>

                </div>

            `;

            return;

        }


        container.innerHTML =
            posts
                .map(
                    post =>
                        renderPost(post)
                )
                .join("");

    }



    /* =====================================================
       RENDER POST
    ===================================================== */

    function renderPost(post) {

        const name =
            post.name ||
            "Freedom Member";


        const category =
            categoryNames[
                post.category
            ] ||
            "Community";


        const isOwner =
            currentUser &&
            post.email ===
                currentUser.email;


        const isAdmin =
            currentUser &&
            currentUser.email ===
                ADMIN_EMAIL;


        const canDelete =
            isOwner ||
            isAdmin;


        const replies =
            Array.isArray(
                post.replies
            )
                ? post.replies
                : [];


        return `

            <article
                class="post-card"
                data-id="${escapeHTML(post.id)}"
            >


                <div class="post-header">


                    <div class="member">


                        <div class="avatar">

                            ${escapeHTML(
                                getInitial(name)
                            )}

                        </div>


                        <div>

                            <div class="member-name">

                                ${escapeHTML(
                                    name
                                )}

                            </div>


                            <div class="post-date">

                                ${escapeHTML(
                                    formatDate(
                                        post.createdAt
                                    )
                                )}

                            </div>

                        </div>

                    </div>


                    <span class="badge">

                        ${escapeHTML(
                            category
                        )}

                    </span>


                </div>



                <div class="post-message">

                    ${escapeHTML(
                        post.message
                    )}

                </div>



                <div class="post-actions">


                    <button
                        class="action-btn reply-toggle"
                        data-id="${escapeHTML(post.id)}"
                    >
                        Reply
                    </button>


                    ${
                        canDelete
                            ? `

                                <button
                                    class="action-btn delete-btn delete-post"
                                    data-id="${escapeHTML(post.id)}"
                                >
                                    Delete
                                </button>

                              `
                            : ""
                    }


                </div>



                ${
                    replies.length
                        ? `

                            <div class="replies">

                                ${

                                    replies
                                        .map(
                                            reply => `

                                                <div class="reply">

                                                    <div class="reply-name">

                                                        ${escapeHTML(
                                                            reply.name ||
                                                            "Member"
                                                        )}

                                                    </div>

                                                    <div class="reply-message">

                                                        ${escapeHTML(
                                                            reply.message ||
                                                            ""
                                                        )}

                                                    </div>

                                                </div>

                                            `
                                        )
                                        .join("")

                                }

                            </div>

                          `
                        : ""
                }



                <div
                    class="reply-form"
                    id="replyForm-${escapeHTML(post.id)}"
                >

                    <input
                        class="reply-input"
                        id="replyInput-${escapeHTML(post.id)}"
                        placeholder="Write a reply..."
                    >


                    <button
                        class="reply-submit"
                        data-id="${escapeHTML(post.id)}"
                    >
                        Reply
                    </button>

                </div>


            </article>

        `;

    }



    /* =====================================================
       CREATE POST
    ===================================================== */

    async function createPost() {

        if (!currentUser) {

            alert(
                "Please log in first."
            );

            return;

        }


        const input =
            document.getElementById(
                "messageInput"
            );


        const message =
            input.value.trim();


        if (!message) {

            alert(
                "Please write something first."
            );

            return;

        }


        const button =
            document.getElementById(
                "postButton"
            );


        button.disabled = true;

        button.textContent =
            "Posting...";


        try {

            await addDoc(
                collection(
                    db,
                    "community"
                ),
                {

                    name:
                        getMemberName(),

                    email:
                        currentUser.email || "",

                    uid:
                        currentUser.uid,

                    category:
                        currentCategory ===
                        "all"
                            ? "checkin"
                            : currentCategory,

                    message:
                        message,

                    replies:
                        [],

                    createdAt:
                        serverTimestamp()

                }
            );


            input.value = "";


            await loadCommunity();

        }

        catch(error) {

            console.error(
                "POST ERROR:",
                error
            );


            alert(
                "Your post could not be added."
            );

        }


        button.disabled = false;

        button.textContent =
            "Post";

    }



    /* =====================================================
       DELETE POST
    ===================================================== */

    async function deletePost(
        postId
    ) {

        if (!currentUser) {
            return;
        }


        const post =
            allPosts.find(
                item =>
                    item.id === postId
            );


        if (!post) {
            return;
        }


        const isOwner =
            post.email ===
            currentUser.email;


        const isAdmin =
            currentUser.email ===
            ADMIN_EMAIL;


        if (
            !isOwner &&
            !isAdmin
        ) {

            alert(
                "You do not have permission to delete this post."
            );

            return;

        }


        const confirmed =
            confirm(
                "Delete this community post?"
            );


        if (!confirmed) {
            return;
        }


        try {

            await deleteDoc(
                doc(
                    db,
                    "community",
                    postId
                )
            );


            await loadCommunity();

        }

        catch(error) {

            console.error(
                "DELETE ERROR:",
                error
            );


            alert(
                "The post could not be deleted."
            );

        }

    }



    /* =====================================================
       ADD REPLY
    ===================================================== */

    async function addReply(
        postId
    ) {

        if (!currentUser) {
            return;
        }


        const input =
            document.getElementById(
                `replyInput-${postId}`
            );


        const message =
            input.value.trim();


        if (!message) {

            alert(
                "Please write a reply."
            );

            return;

        }


        const post =
            allPosts.find(
                item =>
                    item.id === postId
            );


        if (!post) {
            return;
        }


        const replies =
            Array.isArray(
                post.replies
            )
                ? [
                    ...post.replies
                ]
                : [];


        replies.push({

            name:
                getMemberName(),

            email:
                currentUser.email || "",

            uid:
                currentUser.uid,

            message:
                message,

            createdAt:
                new Date()
                    .toISOString()

        });


        try {

            await updateDoc(

                doc(
                    db,
                    "community",
                    postId
                ),

                {
                    replies:
                        replies
                }

            );


            await loadCommunity();

        }

        catch(error) {

            console.error(
                "REPLY ERROR:",
                error
            );


            alert(
                "Your reply could not be added."
            );

        }

    }



    /* =====================================================
       CATEGORY BUTTONS
    ===================================================== */

    document
        .querySelectorAll(
            ".category-btn"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        document
                            .querySelectorAll(
                                ".category-btn"
                            )
                            .forEach(
                                btn =>
                                    btn.classList.remove(
                                        "active"
                                    )
                            );


                        button.classList.add(
                            "active"
                        );


                        currentCategory =
                            button.dataset.category;


                        const label =
                            document.getElementById(
                                "currentCategory"
                            );


                        if (
                            currentCategory ===
                            "all"
                        ) {

                            label.textContent =
                                "Category: Community";

                        }

                        else {

                            label.textContent =
                                `Category: ${
                                    categoryNames[
                                        currentCategory
                                    ]
                                }`;

                        }


                        renderCommunity();

                    }
                );

            }
        );



    /* =====================================================
       POST BUTTON
    ===================================================== */

    document
        .getElementById(
            "postButton"
        )
        .addEventListener(
            "click",
            createPost
        );



    /* =====================================================
       POST ACTIONS
    ===================================================== */

    document.addEventListener(
        "click",
        event => {


            /* DELETE */

            if (
                event.target.classList.contains(
                    "delete-post"
                )
            ) {

                deletePost(
                    event.target.dataset.id
                );

                return;

            }



            /* REPLY OPEN */

            if (
                event.target.classList.contains(
                    "reply-toggle"
                )
            ) {

                const id =
                    event.target.dataset.id;


                const form =
                    document.getElementById(
                        `replyForm-${id}`
                    );


                if (form) {

                    form.classList.toggle(
                        "show"
                    );

                }

                return;

            }



            /* REPLY SUBMIT */

            if (
                event.target.classList.contains(
                    "reply-submit"
                )
            ) {

                addReply(
                    event.target.dataset.id
                );

            }

        }
    );



    /* =====================================================
       BACK TO DASHBOARD
    ===================================================== */

    document
        .getElementById(
            "backBtn"
        )
        .addEventListener(
            "click",
            () => {

                window.location.href =
                    "index.html";

            }
        );



    /* =====================================================
       AUTH
    ===================================================== */

    onAuthStateChanged(

        auth,

        async user => {


            if (!user) {

                window.location.href =
                    "login.html";

                return;

            }


            currentUser =
                user;


            await loadCommunity();

        }

    );


</script>

</body>

</html>
