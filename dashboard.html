/* =========================

========================= */

function getValue(id) {

    const element =
        document.getElementById(id);

    return element
        ? String(
            element.value || ""
        ).trim()
        : "";

}


function escapeHTML(value) {

    if (
        value === undefined ||
        value === null
    ) {

        return "";

    }

    return String(value)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}


function showMessage(
    message,
    type = "success"
) {

    const box =
        document.getElementById(
            "adminMessage"
        );

    if (!box) return;

    box.textContent =
        message;

    box.className =
        `admin-message ${type}`;

    setTimeout(

                "";

            box.className =

}

/* =========================

========================= */

async function loadMembers() {

    const container =
        document.getElementById(
            "membersTableBody"

    if (!container) return;


    try {

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "members"
                )
            );


        members = [];


        snapshot.forEach(
            docSnap => {

                members.push({

                    id:
                        docSnap.id,

                    ...docSnap.data()

                });

            }
        );


        renderMembers();

    } catch(error) {

        console.error(
            "MEMBERS ERROR",
            error
        );

        container.innerHTML = `

            <tr>

                <td colspan="7">

                    Unable to load members.

                </td>

            </tr>

        `;

    }

}

/* =========================
   LOAD WEEKLY CONTENT
========================= */

async function loadWeeklyContent() {

    try {

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "weeklyContent"
                )
            );


        weeklyContent = [];


        snapshot.forEach(
            docSnap => {

                weeklyContent.push({

                    id:
                        docSnap.id,

                    ...docSnap.data()

                });

            }
        );


        weeklyContent.sort(
            (a,b) =>
                Number(a.week || 0) -
                Number(b.week || 0)
        );


        renderAdminWeeks();


    } catch(error) {

        console.error(
            "WEEK CONTENT ERROR",
            error
        );

    }

}


/* =========================
   RENDER WEEK LIST
========================= */

function renderAdminWeeks() {

    const container =
        document.getElementById(
            "adminWeeksContainer"
        );

    if (!container) return;


    let html = "";


    for (
        let week = 1;
        week <= 13;
        week++
    ) {

        const data =
            weeklyContent.find(
                item =>
                    Number(item.week) ===
                    week
            );


        html += `

            <button
                class="
                    admin-week-button
                    ${
                        selectedWeek === week
                            ? "active"
                            : ""
                    }
                "
                data-admin-week="${week}"
            >

                Week ${week}

                <small>
                    ${
                        data?.title ||
                        "Not added yet"
                    }
                </small>

            </button>

        `;

    }


    container.innerHTML =
        html;


    container
        .querySelectorAll(
            "[data-admin-week]"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        selectedWeek =
                            Number(
                                button.dataset.adminWeek
                            );

                        renderAdminWeeks();

                        renderAdminDays();

                    }
                );

            }
        );


    renderAdminDays();

}


/* =========================
   RENDER DAYS
========================= */

function renderAdminDays() {

    const container =
        document.getElementById(
            "adminDaysContainer"
        );

    if (!container) return;


    const weekData =
        weeklyContent.find(
            item =>
                Number(item.week) ===
                selectedWeek
        ) || {

            week:
                selectedWeek,

            title:
                `Week ${selectedWeek}`,

            description:
                "",

            goal:
                "",

            days:
                []

        };


    let html = "";


    const startDay =
        (
            selectedWeek - 1
        ) * 7 + 1;


    const endDay =
        Math.min(
            selectedWeek * 7,
            90
        );


    for (
        let day = startDay;
        day <= endDay;
        day++
    ) {

        const dayData =
            weekData.days?.find(
                item =>
                    Number(item.day) ===
                    day
            ) || {};


        html += `

            <button
                class="
                    admin-day-button
                    ${
                        selectedDay === day
                            ? "active"
                            : ""
                    }
                "
                data-admin-day="${day}"
            >

                Day ${day}

                <span>
                    ${
                        dayData.movement ||
                        "No content"
                    }
                </span>

            </button>

        `;

    }


    container.innerHTML =
        html;


    container
        .querySelectorAll(
            "[data-admin-day]"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        selectedDay =
                            Number(
                                button.dataset.adminDay
                            );

                        renderAdminDays();

                        loadDayIntoEditor();

                    }
                );

            }
        );


    loadWeekIntoEditor();

    loadDayIntoEditor();

}


/* =========================
   LOAD WEEK EDITOR
========================= */

function loadWeekIntoEditor() {

    const data =
        weeklyContent.find(
            item =>
                Number(item.week) ===
                selectedWeek
        ) || {};


    const fields = {

        "editWeekTitle":
            data.title || "",

        "editWeekDescription":
            data.description || "",

        "editWeekGoal":
            data.goal || ""

    };


    Object.entries(fields)
        .forEach(
            ([id,value]) => {

                const element =
                    document.getElementById(
                        id
                    );

                if (element) {

                    element.value =
                        value;

                }

            }
        );

}


/* =========================
   LOAD DAY EDITOR
========================= */

function loadDayIntoEditor() {

    const weekData =
        weeklyContent.find(
            item =>
                Number(item.week) ===
                selectedWeek
        ) || {};


    const dayData =
        weekData.days?.find(
            item =>
                Number(item.day) ===
                selectedDay
        ) || {};


    const fields = {

        "editDayPhase":
            dayData.phase || "",

        "editMovement":
            dayData.movement || "",

        "editMovementInstruction":
            dayData.movementInstruction || "",

        "editSleep":
            dayData.sleep || "",

        "editSleepInstruction":
            dayData.sleepInstruction || "",

        "editHydration":
            dayData.hydration || "",

        "editHydrationInstruction":
            dayData.hydrationInstruction || "",

        "editProtein":
            dayData.protein || "",

        "editProteinInstruction":
            dayData.proteinInstruction || "",

        "editNutrition":
            dayData.nutrition || "",

        "editNutritionInstruction":
            dayData.nutritionInstruction || "",

        "editMind":
            dayData.mind || "",

        "editMindInstruction":
            dayData.mindInstruction || "",

        "editSunlight":
            dayData.sunlight || "",

        "editSunlightInstruction":
            dayData.sunlightInstruction || "",

        "editRecovery":
            dayData.recovery || "",

        "editRecoveryInstruction":
            dayData.recoveryInstruction || ""

    };


    Object.entries(fields)
        .forEach(
            ([id,value]) => {

                const element =
                    document.getElementById(
                        id
                    );

                if (element) {

                    element.value =

                }

            }
        );


    const dayNumber =
        document.getElementById(
            "editingDayNumber"
        );

    if (dayNumber) {

        dayNumber.textContent =
            `Day ${selectedDay}`;

    }

/* =========================
   SAVE WEEK
========================= */

async function saveWeek() {

    const weekData = {

        week:
            selectedWeek,

        title:
            getValue(
                "editWeekTitle"
            ),

        description:
            getValue(
                "editWeekDescription"
            ),

        goal:
            getValue(
                "editWeekGoal"
            )

    };


    try {

        const existing =
            weeklyContent.find(
                item =>
                    Number(item.week) ===
                    selectedWeek
            );


        const days =
            existing?.days ||
            [];


        await setDoc(
            doc(
                db,
                "weeklyContent",
                `week${selectedWeek}`
            ),
            {
                ...weekData,
                days
            },
            {
                merge: true
            }
        );


        await loadWeeklyContent();


        showMessage(
            `Week ${selectedWeek} saved successfully.`
        );


    } catch(error) {

        console.error(
            "SAVE WEEK ERROR",
            error
        );

        showMessage(
            "Unable to save week.",
            "error"
        );

    }

}


/* =========================
   SAVE DAY
========================= */

async function saveDay() {

    const existing =
        weeklyContent.find(
            item =>
                Number(item.week) ===
                selectedWeek
        ) || {};


    let days =
        Array.isArray(
            existing.days
        )
            ? [...existing.days]
            : [];


    const dayData = {

        day:
            selectedDay,

        phase:
            getValue(
                "editDayPhase"
            ),

        movement:
            getValue(
                "editMovement"
            ),

        movementInstruction:
            getValue(
                "editMovementInstruction"
            ),

        sleep:
            getValue(
                "editSleep"
            ),

        sleepInstruction:
            getValue(
                "editSleepInstruction"
            ),

        hydration:
            getValue(
                "editHydration"
            ),

        hydrationInstruction:
            getValue(
                "editHydrationInstruction"
            ),

        protein:
            getValue(
                "editProtein"
            ),

        proteinInstruction:
            getValue(
                "editProteinInstruction"
            ),

        nutrition:
            getValue(
                "editNutrition"
            ),

        nutritionInstruction:
            getValue(
                "editNutritionInstruction"
            ),

        mind:
            getValue(
                "editMind"
            ),

        mindInstruction:
            getValue(
                "editMindInstruction"
            ),

        sunlight:
            getValue(
                "editSunlight"
            ),

        sunlightInstruction:
            getValue(
                "editSunlightInstruction"
            ),

        recovery:
            getValue(
                "editRecovery"
            ),

        recoveryInstruction:
            getValue(
                "editRecoveryInstruction"
            )

    };


    const existingIndex =
        days.findIndex(
            item =>
                Number(item.day) ===
                selectedDay
        );


    if (
        existingIndex >= 0
    ) {

        days[
            existingIndex
        ] =
            dayData;

    } else {

        days.push(
            dayData
        );

    }


    days.sort(
        (a,b) =>
            Number(a.day) -
            Number(b.day)
    );


    try {

        await setDoc(
            doc(
                db,
                "weeklyContent",
                `week${selectedWeek}`
            ),
            {
                week:
                    selectedWeek,

                title:
                    existing.title ||
                    `Week ${selectedWeek}`,

                description:
                    existing.description ||
                    "",

                goal:
                    existing.goal ||
                    "",

                days

            },
            {
                merge: true
            }
        );


        await loadWeeklyContent();


        showMessage(
            `Day ${selectedDay} saved successfully.`
        );


    } catch(error) {

        console.error(
            "SAVE DAY ERROR",
            error
        );

        showMessage(
            "Unable to save day.",
            "error"
        );

    }

}


/* =========================
   SAVE BUTTONS
========================= */

document
    .getElementById(

    )

document
    .getElementById(

/* =========================
   LIFETIME HABITS
========================= */

async function loadLifetimeHabits() {

    try {

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "lifetimeHabits"
                )
            );


        lifetimeHabits = [];


        snapshot.forEach(
            docSnap => {

                lifetimeHabits.push({

                    id:
                        docSnap.id,

                    ...docSnap.data()

                });

            }
        );


        lifetimeHabits.sort(
            (a,b) =>
                Number(
                    a.order ||
                    999
                ) -
                Number(
                    b.order ||
                    999
                )
        );


        renderLifetimeAdmin();


    } catch(error) {

        console.error(
            "LIFETIME LOAD ERROR",
            error
        );

    }

}

                            ${escapeHTML(
                                item.title ||
                                item.name ||
                                "Lifetime Habit"
                            )}
                        </h3>

                        <p>
                            ${escapeHTML(
                                item.description ||
                                ""
                            )}
                        </p>

                    </div>

                    <div>

                        <button
                            class="edit-lifetime"
                            data-id="${escapeHTML(
                                item.id
                            )}"
                        >
                            Edit
                        </button>

                        <button
                            class="delete-lifetime"
                            data-id="${escapeHTML(
                                item.id
                            )}"
                        >
                            Delete
                        </button>

                    </div>

                </div>

            `
        ).join("");


    container
        .querySelectorAll(
            ".edit-lifetime"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        editLifetimeHabit(
                            button.dataset.id
                        );

                    }
                );

            }
        );


    container
        .querySelectorAll(
            ".delete-lifetime"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        deleteLifetimeHabit(
                            button.dataset.id
                        );

                    }
                );

            }
        );

}


/* =========================
   EDIT LIFETIME HABIT
========================= */

function editLifetimeHabit(
    id
) {

    const item =
        lifetimeHabits.find(
            habit =>
                habit.id === id
        );


    if (!item) return;


    document.getElementById(
        "lifetimeEditId"
    ).value =
        item.id;


    document.getElementById(
        "lifetimeTitle"
    ).value =
        item.title ||
        item.name ||
        "";


    document.getElementById(
        "lifetimeDescription"
    ).value =
        item.description ||
        "";


    document.getElementById(
        "lifetimeOrder"
    ).value =
        item.order ||
        "";


    document.getElementById(
        "lifetimeImage"
    ).value =
        item.image ||
        item.imageUrl ||
        "";


    document.getElementById(
        "lifetimeHabits"
    ).value =
        Array.isArray(
            item.habits
        )
            ? item.habits
                .map(
                    habit =>
                        typeof habit === "string"
                            ? habit
                            : habit.name ||
                              habit.habit ||
                              ""
                )
                .join("\n")
            : "";


    document.getElementById(
        "lifetimeEditor"
    ).scrollIntoView({
        behavior: "smooth"
    });

}


/* =========================
   SAVE LIFETIME HABIT
========================= */

async function saveLifetimeHabit() {

    const id =
        getValue(
            "lifetimeEditId"
        );


    const habits =
        getValue(
            "lifetimeHabits"
        )
        .split("\n")
        .map(
            item =>
                item.trim()
        )
        .filter(
            Boolean
        );


    const data = {

        title:
            getValue(
                "lifetimeTitle"
            ),

        description:
            getValue(
                "lifetimeDescription"
            ),

        order:
            Number(
                getValue(
                    "lifetimeOrder"
                )
            ) || 999,

        image:
            getValue(
                "lifetimeImage"
            ),

        habits

    };


    try {

        if (id) {

            await updateDoc(
                doc(
                    db,
                    "lifetimeHabits",
                    id
                ),
                data
            );

        } else {

            await addDoc(
                collection(
                    db,
                    "lifetimeHabits"
                ),
                data
            );

        }


        clearLifetimeEditor();

        await loadLifetimeHabits();


        showMessage(
            "Lifetime habit saved successfully."
        );


    } catch(error) {

        console.error(
            "LIFETIME SAVE ERROR",
            error
        );

        showMessage(
            "Unable to save lifetime habit.",
            "error"
        );

    }

}


/* =========================
   DELETE LIFETIME HABIT
========================= */

async function deleteLifetimeHabit(
    id
) {

    const confirmed =
        confirm(
            "Delete this lifetime habit?"
        );


    if (!confirmed) return;


    try {

        await deleteDoc(
            doc(
                db,
                "lifetimeHabits",
                id
            )
        );


        await loadLifetimeHabits();


        showMessage(
            "Lifetime habit deleted."
        );


    } catch(error) {

        console.error(
            "DELETE LIFETIME ERROR",
            error
        );

        showMessage(
            "Unable to delete habit.",
            "error"
        );

    }

}


/* =========================
   CLEAR LIFETIME EDITOR
========================= */

function clearLifetimeEditor() {

    [
        "lifetimeEditId",
        "lifetimeTitle",
        "lifetimeDescription",
        "lifetimeOrder",
        "lifetimeImage",
        "lifetimeHabits"
    ]
    .forEach(
        id => {

            const element =
                document.getElementById(
                    id
                );

            if (element) {

                element.value =
                    "";

            }

        }
    );

}


document
    .getElementById(
        "saveLifetime"
    )
    ?.addEventListener(
        "click",
        saveLifetimeHabit
    );


document
    .getElementById(
        "clearLifetime"
    )
    ?.addEventListener(
        "click",
        clearLifetimeEditor
    );
